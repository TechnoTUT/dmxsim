name: Release

# v で始まるタグ (例: v1.0.0) を push したときに、コンテナイメージをビルドして
# GitHub Container Registry (ghcr.io) に置き、GitHub の Release を作る。
#   git tag v1.0.0 && git push origin v1.0.0
# TechnoTUT/Infra の k8s/manifest/dmxsim は ghcr.io/technotut/dmxsim:<バージョン> を使う。
on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: technotut/dmxsim

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release を作る
      packages: write # ghcr.io に push する
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ v1.2.3 から 1.2.3 / 1.2 / latest を付ける
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 前のタグからの変更をまとめたリリースノートを自動で作る
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Container image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`"
